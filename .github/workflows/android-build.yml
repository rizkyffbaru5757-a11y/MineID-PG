name: Build MineID Snippet

on:
  workflow_dispatch:
  push:
    paths:
      - 'mineid.zip'
      - '.github/workflows/android-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project
        shell: bash
        run: |
          unzip -o mineid.zip -d extracted

          PROJECT_DIR="$(dirname "$(find extracted -name settings.gradle.kts -print -quit)")"

          if [ -z "$PROJECT_DIR" ] || [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "Android project structure was not found."
            find extracted -maxdepth 5 -type f | head -100
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project directory: $PROJECT_DIR"

            - name: Install Gradle
        run: |
          curl -fsSL \
            https://services.gradle.org/distributions/gradle-9.4.1-bin.zip \
            -o /tmp/gradle.zip

          sudo unzip -q /tmp/gradle.zip -d /opt

          echo "/opt/gradle-9.4.1/bin" >> "$GITHUB_PATH"

      - name: Verify Gradle
        run: gradle --version

      - name: Build debug APK
        run: |
          gradle --no-daemon -p "$PROJECT_DIR" assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MineID
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
